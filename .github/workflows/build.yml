name: Build Desktop App

# Manual only: a full bundle takes far longer than the CI checks and nothing downstream
# waits on it, so it runs when someone actually wants installers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            artifact-name: linux-x86_64
          - platform: windows-latest
            artifact-name: windows-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # tauri-action does not install these itself -- the Tauri docs' own CI example
      # carries the same step. `patchelf` is what the AppImage bundler needs.
      - name: Install Tauri's Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92

      - uses: Swatinem/rust-cache@v2
        with:
          # Cargo.toml lives in src-tauri/, and this action does not look into
          # subdirectories on its own -- without this the cache never hits.
          workspaces: src-tauri

      # `beforeBuildCommand` runs `bun run build`, which needs node_modules.
      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-${{ steps.sha.outputs.short }}
          # Cargo writes target/ next to Cargo.toml, so the bundles land under
          # src-tauri/, not the repo root.
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          # Say so loudly rather than uploading an empty artifact.
          if-no-files-found: error
